<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yolanda Muñoz Rojas | Asmetales</title>
<style>
  :root{
    --azul:#2E73B1;
    --azul-oscuro:#1f5282;
    --blanco:#ffffff;
    --gris:#f2f6fa;
    --texto:#1d2b38;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--azul) 0%,var(--azul-oscuro) 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;max-width:380px;
    background:var(--blanco);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.28);
    animation:subir .6s ease both;
  }
  @keyframes subir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .header{
    background:var(--azul);
    padding:34px 24px 80px;
    text-align:center;
    position:relative;
    color:var(--blanco);
  }
  .header::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:48px;
    background:var(--blanco);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .empresa{
    font-size:13px;letter-spacing:4px;text-transform:uppercase;font-weight:600;opacity:.9;
  }
  .avatar{
    width:156px;height:156px;border-radius:50%;
    background:var(--blanco);
    margin:-84px auto 0;position:relative;z-index:2;
    padding:4px;
    box-shadow:0 10px 26px rgba(31,82,130,.40);
  }
  .avatar img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}
  .info{padding:18px 26px 8px;text-align:center}
  .info h1{font-size:24px;color:var(--texto);line-height:1.2}
  .cargo{
    display:inline-block;margin-top:10px;
    background:var(--gris);color:var(--azul);
    padding:6px 16px;border-radius:999px;
    font-size:14px;font-weight:600;
  }
  .datos{padding:18px 22px 4px}
  .dato{
    display:flex;align-items:center;gap:14px;
    padding:13px 14px;margin-bottom:10px;
    background:var(--gris);border-radius:16px;
    text-decoration:none;color:var(--texto);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .dato:active,.dato:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(46,115,177,.18)}
  .icono{
    flex:0 0 42px;height:42px;border-radius:12px;
    background:var(--azul);display:flex;align-items:center;justify-content:center;
  }
  .icono svg{width:22px;height:22px;fill:var(--blanco)}
  .dato small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b7c8c}
  .dato span{font-size:15px;font-weight:600;word-break:break-all}
  .acciones{padding:10px 22px 28px}
  .btn-guardar{
    width:100%;border:none;cursor:pointer;
    background:var(--azul);color:var(--blanco);
    font-size:17px;font-weight:700;
    padding:17px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 10px 24px rgba(46,115,177,.45);
    transition:background .2s, transform .15s;
    animation:pulso 2.4s infinite;
  }
  .btn-guardar:hover{background:var(--azul-oscuro)}
  .btn-guardar:active{transform:scale(.98)}
  .btn-guardar svg{width:22px;height:22px;fill:var(--blanco)}
  @keyframes pulso{
    0%{box-shadow:0 10px 24px rgba(46,115,177,.45),0 0 0 0 rgba(46,115,177,.45)}
    70%{box-shadow:0 10px 24px rgba(46,115,177,.45),0 0 0 14px rgba(46,115,177,0)}
    100%{box-shadow:0 10px 24px rgba(46,115,177,.45),0 0 0 0 rgba(46,115,177,0)}
  }
  .web{display:block;text-align:center;font-size:12px;color:#8696a5;padding-bottom:18px}
  .web strong{color:var(--azul);letter-spacing:1px}
</style>
</head>
